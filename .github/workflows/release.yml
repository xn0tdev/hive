name: Release

on:
  push:
    tags:
      - "v*.*.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-13
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release -p hive-agent --target ${{ matrix.target }}

      - name: Package (Unix)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../hive-${{ matrix.target }}.tar.gz hive
          cd ../../..
          sha256sum hive-${{ matrix.target }}.tar.gz > hive-${{ matrix.target }}.sha256

      - name: Package (Windows)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../hive-${{ matrix.target }}.zip hive.exe
          cd ../../..
          $hash = (Get-FileHash hive-${{ matrix.target }}.zip -Algorithm SHA256).Hash
          "$hash  hive-${{ matrix.target }}.zip" | Out-File -Encoding ascii hive-${{ matrix.target }}.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: hive-${{ matrix.target }}
          path: |
            hive-${{ matrix.target }}.*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create checksums file
        run: |
          cat artifacts/*.sha256 > checksums.txt
          cat checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/hive-*.tar.gz
            artifacts/hive-*.zip
            artifacts/hive-*.sha256
            checksums.txt
