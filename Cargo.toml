[workspace]
resolver = "2"
members = ["crates/*", "lib/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
authors = ["gotlib"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
eventsource-stream = "0.2"
inventory = "0.3"
directories = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ignore = "0.4"
globset = "0.4"
regex = "1"

comb = { path = "lib/comb" }
hive-core = { path = "crates/hive-core" }
hive-llm = { path = "crates/hive-llm" }
hive-tui = { path = "crates/hive-tui" }

[profile.release]
lto = "thin"
strip = true
