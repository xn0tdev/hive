[workspace]
resolver = "2"
members = ["crates/*", "lib/*"]

[workspace.package]
edition = "2021"
version = "0.2.1"
license = "MIT"
authors = ["gotlib"]
repository = "https://github.com/xn0tdev/hive"
homepage = "https://github.com/xn0tdev/hive"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip"] }
futures-util = "0.3"
eventsource-stream = "0.2"
inventory = "0.3"
directories = "5"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
ignore = "0.4"
globset = "0.4"
regex = "1"
libc = "0.2"
portable-pty = "0.9.0"
vt100 = "0.16.2"
strip-ansi-escapes = "0.2.1"

# Local path + version so `cargo publish` can resolve crates.io deps.
# `comb-tui` on crates.io; Rust crate name stays `comb`.
comb = { package = "comb-tui", path = "lib/comb", version = "0.2.1" }
hive-core = { path = "crates/hive-core", version = "0.2.1" }
hive-llm = { path = "crates/hive-llm", version = "0.2.1" }
hive-tui = { path = "crates/hive-tui", version = "0.2.1" }

[profile.release]
lto = "thin"
strip = true
