[package]
name = "comb-tui"
description = "A tiny native terminal-UI engine — a comb of cells: surfaces, layers, effects."
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
repository = "https://github.com/xn0tdev/comb"
homepage = "https://github.com/xn0tdev/comb"
documentation = "https://docs.rs/comb-tui"
keywords = ["tui", "terminal", "ui", "ansi"]
categories = ["command-line-interface", "gui"]
publish = false # published from https://github.com/xn0tdev/comb

[lib]
name = "comb"
path = "src/lib.rs"

[dependencies]
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
] }

[[example]]
name = "demo"
path = "examples/demo.rs"
